name: Build and publish Blogger theme

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build theme
        run: |
          VITE_BASE=jsdelivr-dev pnpm run build
          pnpm run build:output

      - name: Publish static files
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: static-dev
          publish_dir: ./.output
          force_orphan: true
          disable_nojekyll: true

      - name: Purge jsDelivr cache
        run: |
          curl -fsSL \
            "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@static-dev/%40themes/react-theme/dist/template.xml" \
            || true
